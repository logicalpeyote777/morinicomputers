apiVersion: v1
kind: Namespace
metadata: { name: empresa }
---
apiVersion: v1
kind: Secret
metadata: { name: mariadb-pass, namespace: empresa }
stringData: { password: "Morini2026" }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: datos-facturas, namespace: empresa }
spec:
  accessModes: [ ReadWriteOnce ]
  resources: { requests: { storage: 1Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: facturas-db, namespace: empresa, labels: { app: facturas-db } }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: facturas-db } }
  template:
    metadata: { labels: { app: facturas-db } }
    spec:
      containers:
        - name: mariadb
          image: mariadb:11.4
          args: [ "--innodb-buffer-pool-size=64M" ]
          env:
            - name: MARIADB_ROOT_PASSWORD
              valueFrom: { secretKeyRef: { name: mariadb-pass, key: password } }
            - name: MARIADB_DATABASE
              value: facturacion
          ports: [ { containerPort: 3306 } ]
          volumeMounts:
            - { name: datos, mountPath: /var/lib/mysql }
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits: { cpu: "1", memory: "700Mi" }
          readinessProbe:
            exec: { command: [ "healthcheck.sh", "--connect" ] }
            initialDelaySeconds: 10
            periodSeconds: 5
      volumes:
        - name: datos
          persistentVolumeClaim: { claimName: datos-facturas }
---
apiVersion: v1
kind: Service
metadata: { name: facturas-db, namespace: empresa }
spec:
  selector: { app: facturas-db }
  ports: [ { port: 3306, targetPort: 3306 } ]

# smartd.conf — vigilancia de los discos del homelab.
# Un renglon por disco. NUNCA un DEVICESCAN a secas: en SATA se resuelve
# como -d scsi y te quedas sin la tabla de atributos (y siempre "OK").

/dev/sda -d sat -a -o on -S on \
  -s (S/../.././02|L/../../6/03) \
  -R 5 -R 187 -R 188 -C 197 -U 198 \
  -W 4,45,50 \
  -m <nomailer> -M exec /home/homelab/lab/smart/aviso.sh -M test

/dev/sdb -d sat -a -o on -S on \
  -s (S/../.././02|L/../../6/03) \
  -R 5 -R 187 -R 188 -C 197 -U 198 \
  -W 4,45,50 \
  -m <nomailer> -M exec /home/homelab/lab/smart/aviso.sh
